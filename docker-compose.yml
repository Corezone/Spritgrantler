# Betrieb ohne Home Assistant, z. B. in einem Docker-LXC auf Proxmox:
#   docker compose up -d --build   ->   http://<IP>:8099
services:
  spritgrantler:
    build: ./spritgrantler
    container_name: spritgrantler
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data
    environment:
      REGION: "Österreich"      # oder "Wien", ein Bundesland, oder Bezirkscodes "901,902"
      INTERVAL_MIN: "30"
      RETENTION_DAYS: "365"
      REQUEST_DELAY_S: "2.5"
      CENTER_LAT: "48.2082"
      CENTER_LON: "16.3738"
      DEMO: "false"             # "true" = Beispieldaten zum Ausprobieren
    restart: unless-stopped
